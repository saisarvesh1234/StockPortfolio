<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your portfolios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0f1a; --ink-2:#0f1526; --panel:#141b2e; --panel-hover:#182036;
  --rule:#28324c; --brass:#c9a24b; --brass-dim:#8c7231;
  --text:#e9e7df; --mut:#93a0bd;
  --pos:#4fd1a5; --neg:#ef6461;
}
@media (prefers-color-scheme:light){
  :root{
    --ink:#eef1f6; --ink-2:#e4e9f1; --panel:#ffffff; --panel-hover:#f4f7fb;
    --rule:#d7deea; --brass:#8a6a24; --brass-dim:#a68844;
    --text:#141a29; --mut:#5b6478;
    --pos:#0f9d76; --neg:#c9433f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text);
  font-family:'IBM Plex Mono', ui-monospace, monospace;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Fraunces', Georgia, serif; font-weight:500}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

/* ---- Hero ---- */
.hero{
  background:
    radial-gradient(1100px 480px at 12% -10%, color-mix(in srgb, var(--brass) 10%, transparent), transparent 60%),
    var(--ink-2);
  border-bottom:1px solid var(--rule);
  padding:clamp(40px,7vw,88px) clamp(20px,5vw,64px) 0;
}
.heroInner{max-width:1180px; margin:0 auto}
.eyebrow{color:var(--brass); font-size:13px; letter-spacing:.02em; margin:0 0 18px}
h1.title{
  font-size:clamp(42px,7vw,84px); line-height:.98; margin:0 0 20px; max-width:14ch;
}
.sub{color:var(--mut); font-size:15px; max-width:52ch; margin:0 0 32px; line-height:1.6}
.rule{height:1px; background:linear-gradient(90deg, var(--brass), transparent 70%); border:0; margin:0}

/* Ticker tape: one deliberate motion element */
.tickerWrap{overflow:hidden; padding:16px 0; margin-top:8px}
.tickerWrap:hover .tickerTrack{animation-play-state:paused}
.tickerTrack{
  display:inline-flex; white-space:nowrap; gap:48px;
  animation:scroll 34s linear infinite;
  font-size:13px; letter-spacing:.02em; color:var(--mut);
}
.tickerTrack span b{color:var(--text); font-weight:500}
.tickerTrack .up{color:var(--pos)}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tickerTrack{animation:none}}

/* ---- Body ---- */
main{max-width:1180px; margin:0 auto; padding:48px clamp(20px,5vw,64px) 96px}

.createRow{
  display:flex; align-items:end; gap:20px; flex-wrap:wrap;
  padding-bottom:28px; margin-bottom:44px; border-bottom:1px solid var(--rule);
}
.createRow label{display:block; color:var(--brass); font-size:12px; margin-bottom:10px}
.createField{flex:1; min-width:240px}
.createField input{
  width:100%; background:transparent; border:0; border-bottom:1px solid var(--rule);
  color:var(--text); font:500 22px 'Fraunces', Georgia, serif; padding:6px 2px 10px;
}
.createField input::placeholder{color:var(--mut); opacity:.6; font-family:'IBM Plex Mono', monospace; font-size:15px}
.createField input:focus{border-bottom-color:var(--brass)}
.btn{
  font-family:inherit; font-size:14px; background:transparent; color:var(--text);
  border:1px solid var(--rule); border-radius:4px; padding:11px 20px; cursor:pointer;
}
.btn:hover{border-color:var(--brass); color:var(--brass)}
.btn.primary{background:var(--brass); border-color:var(--brass); color:var(--ink)}
.btn.primary:hover{background:var(--brass-dim); border-color:var(--brass-dim); color:var(--ink)}
.createMsg{color:var(--neg); font-size:13px; margin-top:8px; min-height:1em}

.gridLabel{color:var(--brass); font-size:12px; margin:0 0 20px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px}
.pcard{
  background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:26px 24px; cursor:pointer; position:relative;
  display:flex; flex-direction:column; min-height:170px;
}
.pcard:hover{background:var(--panel-hover)}
.badge{
  font-size:13px; font-weight:600; letter-spacing:.03em; color:var(--brass);
  border:1px solid var(--brass-dim); border-radius:3px; padding:3px 8px; width:fit-content; margin-bottom:18px;
}
.pcard h3{font-size:24px; margin:0 0 6px; line-height:1.15}
.pcard .stat{color:var(--mut); font-size:13px; margin:0}
.pcard .open{
  margin-top:auto; padding-top:18px; font-size:13px; color:var(--brass);
  display:flex; align-items:center; gap:6px;
}
.pactions{position:absolute; top:16px; right:16px; display:flex; gap:4px; opacity:0; transition:opacity .12s}
.pcard:hover .pactions, .pcard:focus-within .pactions{opacity:1}
.iconbtn{
  font-family:inherit; font-size:13px; width:26px; height:26px; border-radius:3px;
  background:var(--ink); border:1px solid var(--rule); color:var(--mut); cursor:pointer;
}
.iconbtn:hover{color:var(--text); border-color:var(--brass)}

.renameCard{background:var(--panel); border:1px solid var(--brass); border-radius:6px; padding:26px 24px}
.renameCard input{
  width:100%; background:transparent; border:0; border-bottom:1px solid var(--brass);
  color:var(--text); font:500 22px 'Fraunces', Georgia, serif; padding:4px 0 8px; margin-bottom:16px;
}
.renameActions{display:flex; gap:10px}

.empty{color:var(--mut); font-size:14px; padding:32px 0}

@media (max-width:560px){
  .createRow{flex-direction:column; align-items:stretch}
  .btn.primary{width:100%}
}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="hero">
  <div class="heroInner">
    <p class="eyebrow">Portfolio ledger</p>
    <h1 class="title">Your portfolios</h1>
    <p class="sub">Every portfolio keeps its own holdings, transactions and dividend record. Open one below, or start a new one.</p>
    <hr class="rule">
  </div>
  <div class="tickerWrap"><div class="tickerTrack" id="ticker"></div></div>
</header>

<main>
  <div class="createRow">
    <div class="createField">
      <label for="newName">New portfolio</label>
      <input id="newName" placeholder="e.g. Long-term, US stocks, Family account…">
      <div class="createMsg" id="createMsg"></div>
    </div>
    <button class="btn primary" id="createBtn">Create</button>
  </div>

  <p class="gridLabel" id="gridLabel">Holdings</p>
  <div class="grid" id="list"></div>
</main>

<script src="common.js"></script>
<script>
let editing = null;
let portfolios = [];

function initials(name) {
  const words = name.trim().split(/\s+/).filter(Boolean);
  return (words.length > 1 ? words[0][0] + words[1][0] : name.slice(0, 2)).toUpperCase();
}

function buildTicker(list) {
  const item = p => `<span><b>${esc(p.name)}</b> ${p.stocks} holding${p.stocks === 1 ? '' : 's'}</span>`;
  const row = list.length ? list.map(item).join('<span class="up">◆</span>') : '<span>No portfolios yet — create your first one below</span>';
  $('#ticker').innerHTML = row + '<span class="up">◆</span>' + row + '<span class="up">◆</span>';
}

async function load() {
  const d = await (await fetch('/api/portfolios')).json();
  portfolios = d.portfolios || [];
  buildTicker(portfolios);
  const totalStocks = portfolios.reduce((a, p) => a + p.stocks, 0);
  $('#gridLabel').textContent = portfolios.length
    ? `${portfolios.length} portfolio${portfolios.length === 1 ? '' : 's'} · ${totalStocks} holding${totalStocks === 1 ? '' : 's'} in total`
    : 'Holdings';

  $('#list').innerHTML = portfolios.map(p => {
    if (p.id === editing) {
      return `<div class="renameCard" data-id="${p.id}">
        <input id="renameInput" value="${esc(p.name)}">
        <div class="renameActions"><button class="btn primary" data-act="saveRename" data-id="${p.id}">Save</button><button class="btn" data-act="cancelRename">Cancel</button></div>
      </div>`;
    }
    return `<div class="pcard" data-open="${p.id}" tabindex="0">
      <div class="pactions">
        <button class="iconbtn" data-act="rename" data-id="${p.id}" title="Rename" aria-label="Rename ${esc(p.name)}">✎</button>
        ${portfolios.length > 1 ? `<button class="iconbtn" data-act="delete" data-id="${p.id}" title="Delete" aria-label="Delete ${esc(p.name)}">×</button>` : ''}
      </div>
      <div class="badge">${initials(p.name)}</div>
      <h3>${esc(p.name)}</h3>
      <p class="stat">${p.stocks} holding${p.stocks === 1 ? '' : 's'}</p>
      <div class="open">Open dashboard →</div>
    </div>`;
  }).join('') || '<p class="empty">No portfolios yet — create one above to get started.</p>';

  if (editing) { const el = $('#renameInput'); el.focus(); el.select(); }
}

document.addEventListener('click', async e => {
  const open = e.target.closest('[data-open]');
  if (open && !e.target.closest('button')) { location.href = '/dashboard?pf=' + encodeURIComponent(open.dataset.open); return; }

  const b = e.target.closest('button[data-act]');
  if (!b) return;
  e.stopPropagation();

  if (b.dataset.act === 'rename') { editing = b.dataset.id; load(); }
  if (b.dataset.act === 'cancelRename') { editing = null; load(); }
  if (b.dataset.act === 'saveRename') {
    const name = $('#renameInput').value.trim();
    if (!name) return;
    await fetch('/api/portfolios/' + encodeURIComponent(b.dataset.id), {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name})});
    editing = null; load();
  }
  if (b.dataset.act === 'delete') {
    const p = portfolios.find(x => x.id === b.dataset.id);
    if (!confirm(`Delete "${p ? p.name : 'this portfolio'}" and everything in it? This can't be undone.`)) return;
    const r = await fetch('/api/portfolios/' + encodeURIComponent(b.dataset.id), {method: 'DELETE'});
    if (!r.ok) { const d = await r.json(); alert(d.error || 'Could not delete that portfolio.'); }
    load();
  }
});

document.addEventListener('keydown', e => {
  if (e.target.closest('[data-open]') && e.key === 'Enter') e.target.closest('[data-open]').click();
  if (e.target.id === 'renameInput' && e.key === 'Enter') $('button[data-act="saveRename"]')?.click();
  if (e.target.id === 'renameInput' && e.key === 'Escape') { editing = null; load(); }
});

$('#createBtn').onclick = async () => {
  const name = $('#newName').value.trim();
  const msg = $('#createMsg');
  if (!name) { msg.textContent = 'Give the portfolio a name first.'; return; }
  msg.textContent = '';
  const d = await (await fetch('/api/portfolios', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name})})).json();
  location.href = '/dashboard?pf=' + encodeURIComponent(d.id);
};
$('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#createBtn').click(); });

load();
</script>
</body>
</html>
